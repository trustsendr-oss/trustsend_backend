services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: tumaplus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tumaplus_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tumaplus_dev_password}
      POSTGRES_DB: ${DB_DATABASE:-tumaplus_dev}
    ports:
      # Maps to host 5433 by default to avoid conflict with any host PostgreSQL
      - '${DOCKER_DB_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-tumaplus_user} -d $${POSTGRES_DB:-tumaplus_dev}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tumaplus

  # Redis for caching and BullMQ job queue
  redis:
    image: redis:7-alpine
    container_name: tumaplus_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      # Maps to host 6380 by default to avoid conflict with any host Redis
      - '${DOCKER_REDIS_PORT:-6380}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tumaplus

  # Database Migrations Runner (runs on startup before API & Worker)
  migration:
    image: tumaplus:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tumaplus_migration
    restart: "no"
    command: ["node", "ace.js", "migration:run", "--force", "--no-schema-generate"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_CONNECTION=pg
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-tumaplus_user}
      - DB_PASSWORD=${DB_PASSWORD:-tumaplus_dev_password}
      - DB_DATABASE=${DB_DATABASE:-tumaplus_dev}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tumaplus

  # AdonisJS API Server
  api:
    image: tumaplus:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tumaplus_api
    restart: unless-stopped
    command: ["node", "bin/server.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3330
      - HOST=0.0.0.0
      - APP_URL=${APP_URL:-http://localhost:3330}
      - DB_CONNECTION=pg
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-tumaplus_user}
      - DB_PASSWORD=${DB_PASSWORD:-tumaplus_dev_password}
      - DB_DATABASE=${DB_DATABASE:-tumaplus_dev}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      # Maps to host 3334 by default (can be overridden with APP_PORT=3330)
      - '${APP_PORT:-3334}:3330'
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "const req = require('http').get('http://127.0.0.1:3330/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)); req.on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tumaplus

  # Worker for BullMQ queues
  worker:
    image: tumaplus:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tumaplus_worker
    restart: unless-stopped
    command: ["node", "bin/worker.js"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_CONNECTION=pg
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-tumaplus_user}
      - DB_PASSWORD=${DB_PASSWORD:-tumaplus_dev_password}
      - DB_DATABASE=${DB_DATABASE:-tumaplus_dev}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    networks:
      - tumaplus

networks:
  tumaplus:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  storage_data:
