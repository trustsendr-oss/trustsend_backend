services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: tumaplus_postgres
    environment:
      POSTGRES_USER: tumaplus_user
      POSTGRES_PASSWORD: tumaplus_dev_password
      POSTGRES_DB: tumaplus_dev
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=en_US.UTF-8'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tumaplus_user -d tumaplus_dev']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tumaplus

  # Redis for caching and BullMQ job queue
  redis:
    image: redis:7-alpine
    container_name: tumaplus_redis
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tumaplus

  # AdonisJS API server - Development
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tumaplus_api
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development
      DB_CONNECTION: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: tumaplus_user
      DB_PASSWORD: tumaplus_dev_password
      DB_DATABASE: tumaplus_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3333
      HOST: 0.0.0.0
    ports:
      - '3333:3333'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
    networks:
      - tumaplus

  # Worker - Development
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tumaplus_worker
    command: sh -c "npm install && npm run worker"
    environment:
      NODE_ENV: development
      DB_CONNECTION: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: tumaplus_user
      DB_PASSWORD: tumaplus_dev_password
      DB_DATABASE: tumaplus_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
    networks:
      - tumaplus

networks:
  tumaplus:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  node_modules: