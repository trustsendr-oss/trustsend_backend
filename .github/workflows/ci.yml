name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# A newer push to the same branch or PR makes the running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    # start/env.ts validates every required variable at boot (migrations, tests and build all boot
    # the app), so they are set once for the whole job. Throwaway values: nothing here is a secret.
    env:
      TZ: UTC
      NODE_ENV: test
      PORT: 3333
      HOST: localhost
      LOG_LEVEL: warn
      APP_KEY: ci-app-key-0123456789abcdef0123456789
      APP_URL: http://localhost:3333
      SESSION_DRIVER: memory
      DB_CONNECTION: pg
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_DATABASE: test_db
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # CryptoService requires at least 32 characters.
      ENCRYPTION_KEY: ci-test-encryption-key-0123456789abcdef
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USERNAME: ci
      SMTP_PASSWORD: ci
      MAIL_FROM_ADDRESS: ci@example.com
      MAIL_FROM_NAME: TrustSend CI

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lint (`npm run lint`) and type check (`npm run typecheck`) are skipped for now: the codebase
      # still has many existing lint and type errors. Re-add both steps once they are cleaned up.

      - name: Run migrations
        run: node ace migration:run --force

      - name: Check schema divergence
        run: |
          git diff --exit-code database/schema.ts || (echo "schema.ts diverged from migrations" && exit 1)

      - name: Run tests
        run: npm run test

      # Same flag as the Dockerfile: type errors must not block the build while they are being fixed.
      - name: Build
        run: npm run build -- --ignore-ts-errors
